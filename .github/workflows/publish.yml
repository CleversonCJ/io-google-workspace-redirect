name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Validate browser script
        run: node --check ex_app/js/redirect.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish version 1.0.0
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cleversoncj/io-google-workspace-redirect:1.0.0-cpu
            ghcr.io/cleversoncj/io-google-workspace-redirect:1.0.0
            ghcr.io/cleversoncj/io-google-workspace-redirect:latest-cpu
            ghcr.io/cleversoncj/io-google-workspace-redirect:latest
          provenance: true
          sbom: true
